<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeCraftHub: Learning Management Platform</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f3ff 0%, #fffbeb 100%);
      min-height: 100vh;
      color: #1f2937;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      background: linear-gradient(135deg, #8B5CF6 0%, #7c3aed 100%);
      color: white;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(139, 92, 246, 0.3);
    }

    header h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    header p {
      opacity: 0.9;
      font-size: 1rem;
    }

    .stats-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .stat-item {
      text-align: center;
      padding: 15px;
      border-radius: 8px;
      background: #f9fafb;
    }

    .stat-item .number {
      font-size: 2rem;
      font-weight: bold;
      color: #8B5CF6;
    }

    .stat-item .label {
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 5px;
    }

    .form-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .form-card h2 {
      color: #8B5CF6;
      margin-bottom: 20px;
      font-size: 1.25rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #374151;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #8B5CF6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: #8B5CF6;
      color: white;
    }

    .btn-primary:hover {
      background: #7c3aed;
      transform: translateY(-1px);
    }

    .btn-success {
      background: #F59E0B;
      color: white;
    }

    .btn-success:hover {
      background: #d97706;
    }

    .btn-danger {
      background: #EF4444;
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
    }

    .btn-secondary {
      background: #6b7280;
      color: white;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .message {
      padding: 12px 16px;
      border-radius: 8px;
      margin: 10px 0;
      display: none;
    }

    .message.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.success {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #10b981;
    }

    .message.error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }

    .courses-section {
      margin: 30px 0;
    }

    .courses-section h2 {
      color: #8B5CF6;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .loading-container {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .loading-container .spinner {
      width: 40px;
      height: 40px;
      border-width: 3px;
      border-color: #e5e7eb;
      border-top-color: #8B5CF6;
      margin-bottom: 15px;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .course-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      border-left: 4px solid #8B5CF6;
    }

    .course-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .course-card.status-not-started {
      border-left-color: #6b7280;
    }

    .course-card.status-in-progress {
      border-left-color: #F59E0B;
    }

    .course-card.status-completed {
      border-left-color: #10b981;
    }

    .course-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .course-title {
      font-size: 1.125rem;
      font-weight: 600;
      color: #1f2937;
      flex: 1;
    }

    .course-status {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-not-started .course-status {
      background: #f3f4f6;
      color: #4b5563;
    }

    .status-in-progress .course-status {
      background: #fef3c7;
      color: #92400e;
    }

    .status-completed .course-status {
      background: #d1fae5;
      color: #065f46;
    }

    .course-description {
      color: #6b7280;
      font-size: 0.875rem;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .course-meta {
      display: flex;
      gap: 20px;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-bottom: 15px;
    }

    .course-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .course-actions {
      display: flex;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    .course-actions .btn {
      flex: 1;
      justify-content: center;
      padding: 10px;
      font-size: 0.875rem;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: 12px;
      color: #6b7280;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 15px;
      opacity: 0.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal {
      background: white;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      color: #8B5CF6;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6b7280;
      line-height: 1;
    }

    .modal-close:hover {
      color: #1f2937;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    @media (max-width: 768px) {
      header h1 {
        font-size: 1.5rem;
      }

      .courses-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .stat-item .number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>CodeCraftHub: Your Learning Management Platform</h1>
    <p>Manage your learning journey with ease</p>
  </header>

  <div class="container">
    <div class="stats-card" id="statsCard">
      <div class="stat-item">
        <div class="number" id="statTotal">0</div>
        <div class="label">Total Courses</div>
      </div>
      <div class="stat-item">
        <div class="number" id="statNotStarted">0</div>
        <div class="label">Not Started</div>
      </div>
      <div class="stat-item">
        <div class="number" id="statInProgress">0</div>
        <div class="label">In Progress</div>
      </div>
      <div class="stat-item">
        <div class="number" id="statCompleted">0</div>
        <div class="label">Completed</div>
      </div>
    </div>

    <div class="form-card">
      <h2>Add New Course</h2>
      <div id="addMessage" class="message"></div>
      <form id="addForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="courseName">Course Name *</label>
            <input type="text" id="courseName" required placeholder="Enter course name">
          </div>
          <div class="form-group">
            <label for="courseTargetDate">Target Date *</label>
            <input type="date" id="courseTargetDate" required>
          </div>
          <div class="form-group">
            <label for="courseStatus">Status *</label>
            <select id="courseStatus" required>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-group full-width">
            <label for="courseDescription">Description *</label>
            <textarea id="courseDescription" required placeholder="Enter course description"></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="addBtn">
          <span>Add Course</span>
        </button>
      </form>
    </div>

    <div class="courses-section">
      <h2>Your Courses</h2>
      <div id="courseMessage" class="message"></div>
      <div id="coursesContainer">
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Loading courses...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Course</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="editMessage" class="message"></div>
        <form id="editForm">
          <input type="hidden" id="editCourseId">
          <div class="form-group">
            <label for="editName">Course Name *</label>
            <input type="text" id="editName" required>
          </div>
          <div class="form-group">
            <label for="editDescription">Description *</label>
            <textarea id="editDescription" required></textarea>
          </div>
          <div class="form-group">
            <label for="editTargetDate">Target Date *</label>
            <input type="date" id="editTargetDate" required>
          </div>
          <div class="form-group">
            <label for="editStatus">Status *</label>
            <select id="editStatus" required>
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-success" id="updateBtn" onclick="updateCourse()">
          <span>Update Course</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mlpxwkpwltvyfqwnigrs.supabase.co';
    const API_BASE = `${SUPABASE_URL}/functions/v1/courses/api/courses`;

    let courses = [];

    const coursesContainer = document.getElementById('coursesContainer');
    const addForm = document.getElementById('addForm');
    const addBtn = document.getElementById('addBtn');
    const addMessage = document.getElementById('addMessage');
    const courseMessage = document.getElementById('courseMessage');
    const editModal = document.getElementById('editModal');
    const updateBtn = document.getElementById('updateBtn');
    const editMessageEl = document.getElementById('editMessage');

    const statTotal = document.getElementById('statTotal');
    const statNotStarted = document.getElementById('statNotStarted');
    const statInProgress = document.getElementById('statInProgress');
    const statCompleted = document.getElementById('statCompleted');

    document.addEventListener('DOMContentLoaded', () => {
      fetchCourses();
      fetchStats();
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('courseTargetDate').value = today;
    });

    async function fetchCourses() {
      showLoading();
      try {
        const response = await fetch(API_BASE);
        if (!response.ok) throw new Error('Failed to fetch courses');
        courses = await response.json();
        renderCourses();
      } catch (error) {
        showError(courseMessage, error.message);
        coursesContainer.innerHTML = createEmptyState();
      }
    }

    async function fetchStats() {
      try {
        const response = await fetch(`${API_BASE}/stats`);
        if (!response.ok) throw new Error('Failed to fetch stats');
        const stats = await response.json();
        statTotal.textContent = stats.total;
        statNotStarted.textContent = stats.notStarted;
        statInProgress.textContent = stats.inProgress;
        statCompleted.textContent = stats.completed;
      } catch (error) {
        console.error('Stats error:', error);
      }
    }

    async function createCourse(data) {
      setButtonLoading(addBtn, true);
      try {
        const response = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to create course');
        }
        const newCourse = await response.json();
        courses.unshift(newCourse);
        renderCourses();
        fetchStats();
        addForm.reset();
        document.getElementById('courseTargetDate').value = new Date().toISOString().split('T')[0];
        showSuccess(addMessage, 'Course added successfully!');
      } catch (error) {
        showError(addMessage, error.message);
      } finally {
        setButtonLoading(addBtn, false);
      }
    }

    async function updateCourse() {
      const id = document.getElementById('editCourseId').value;
      const data = {
        name: document.getElementById('editName').value,
        description: document.getElementById('editDescription').value,
        target_date: document.getElementById('editTargetDate').value,
        status: document.getElementById('editStatus').value
      };

      setButtonLoading(updateBtn, true);
      try {
        const response = await fetch(`${API_BASE}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to update course');
        }
        const updatedCourse = await response.json();
        const index = courses.findIndex(c => c.id === id);
        if (index !== -1) courses[index] = updatedCourse;
        renderCourses();
        fetchStats();
        closeModal();
        showSuccess(courseMessage, 'Course updated successfully!');
      } catch (error) {
        showError(editMessageEl, error.message);
      } finally {
        setButtonLoading(updateBtn, false);
      }
    }

    async function deleteCourse(id) {
      if (!confirm('Are you sure you want to delete this course?')) return;

      try {
        const response = await fetch(`${API_BASE}/${id}`, {
          method: 'DELETE'
        });
        if (!response.ok) throw new Error('Failed to delete course');
        courses = courses.filter(c => c.id !== id);
        renderCourses();
        fetchStats();
        showSuccess(courseMessage, 'Course deleted successfully!');
      } catch (error) {
        showError(courseMessage, error.message);
      }
    }

    function renderCourses() {
      if (courses.length === 0) {
        coursesContainer.innerHTML = createEmptyState();
        return;
      }

      coursesContainer.innerHTML = `
        <div class="courses-grid">
          ${courses.map(course => createCourseCard(course)).join('')}
        </div>
      `;
    }

    function createCourseCard(course) {
      const statusClass = course.status.toLowerCase().replace(' ', '-');
      const formattedDate = formatDate(course.created_at);

      return `
        <div class="course-card status-${statusClass}">
          <div class="course-header">
            <h3 class="course-title">${escapeHtml(course.name)}</h3>
            <span class="course-status">${course.status}</span>
          </div>
          <p class="course-description">${escapeHtml(course.description)}</p>
          <div class="course-meta">
            <span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              Target: ${course.target_date}
            </span>
            <span>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              Created: ${formattedDate}
            </span>
          </div>
          <div class="course-actions">
            <button class="btn btn-success" onclick="openEditModal('${course.id}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteCourse('${course.id}')">Remove</button>
          </div>
        </div>
      `;
    }

    function createEmptyState() {
      return `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
          </svg>
          <h3>No courses yet</h3>
          <p>Add your first course to get started!</p>
        </div>
      `;
    }

    function showLoading() {
      coursesContainer.innerHTML = `
        <div class="loading-container">
          <div class="spinner"></div>
          <p>Loading courses...</p>
        </div>
      `;
    }

    function openEditModal(id) {
      const course = courses.find(c => c.id === id);
      if (!course) return;

      document.getElementById('editCourseId').value = course.id;
      document.getElementById('editName').value = course.name;
      document.getElementById('editDescription').value = course.description;
      document.getElementById('editTargetDate').value = course.target_date;
      document.getElementById('editStatus').value = course.status;

      editMessageEl.className = 'message';
      editMessageEl.textContent = '';
      editModal.classList.add('show');
    }

    function closeModal() {
      editModal.classList.remove('show');
    }

    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function showSuccess(element, message) {
      element.className = 'message success show';
      element.textContent = message;
      setTimeout(() => {
        element.classList.remove('show');
      }, 3000);
    }

    function showError(element, message) {
      element.className = 'message error show';
      element.textContent = message;
      setTimeout(() => {
        element.classList.remove('show');
      }, 5000);
    }

    function setButtonLoading(button, loading) {
      const span = button.querySelector('span');
      if (loading) {
        button.disabled = true;
        span.innerHTML = '<span class="spinner"></span> Loading...';
      } else {
        button.disabled = false;
        span.textContent = button.id === 'addBtn' ? 'Add Course' : 'Update Course';
      }
    }

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = {
        name: document.getElementById('courseName').value.trim(),
        description: document.getElementById('courseDescription').value.trim(),
        target_date: document.getElementById('courseTargetDate').value,
        status: document.getElementById('courseStatus').value
      };

      if (!data.name || !data.description || !data.target_date || !data.status) {
        showError(addMessage, 'Please fill in all required fields');
        return;
      }

      createCourse(data);
    });

    editModal.addEventListener('click', (e) => {
      if (e.target === editModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && editModal.classList.contains('show')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
